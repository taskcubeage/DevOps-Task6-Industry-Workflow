name: Sync Team Development to Company

on:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  sync-company:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Team Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Show Git Remotes (Debug)
        run: |
          git remote -v

      - name: Add Company Remote
        env:
          COMPANY_PAT: ${{ secrets.COMPANY_PAT }}
        run: |
          git remote add company https://x-access-token:${COMPANY_PAT}@github.com/AnushkaTakawale/DevOps-Task6-Industry-Workflow.git
          git remote -v

      - name: Push Team Development to Company Development
        run: |
          git push company HEAD:development